  :root{
    --bg:#09090a;
    --stage:#060607;
    --surface:#111113;
    --surface-2:#18181b;
    --surface-3:#202024;
    --hover:#26262b;
    --line:rgba(255,255,255,.06);
    --line-2:rgba(255,255,255,.10);
    --ink:#ececee;
    --ink-2:#a1a1aa;
    --ink-3:#6b6b74;
    --fill:rgba(255,255,255,.08);
    --fill-edge:rgba(255,255,255,.55);
    --r:8px; --r-sm:6px;
    --ease-out:cubic-bezier(.23,1,.32,1);
    --sans:'PP Neue Montreal','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:12.5px; line-height:1.4; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; overflow:hidden;}
  button,input,select{font:inherit; color:inherit}
  ::selection{background:rgba(255,255,255,.18)}
  :focus-visible{outline:2px solid rgba(255,255,255,.5); outline-offset:1px}

  .app{display:flex; flex-direction:column; height:100vh; height:100dvh}

  /* ---------- header ---------- */
  header{display:flex; align-items:center; gap:6px; height:48px; padding:0 10px 0 14px; background:var(--surface); border-bottom:1px solid var(--line); flex:0 0 auto; z-index:5;}
  .brand{display:flex; align-items:center; gap:9px; margin-right:10px; user-select:none}
  .brand .logo{width:20px; height:20px; border-radius:5px; background:var(--ink); color:var(--bg); display:grid; place-items:center; font:700 11px/1 var(--mono)}
  .brand h1{font-size:13px; font-weight:600; letter-spacing:-.01em; margin:0}
  .brand h1 span{color:var(--ink-3); font-weight:500}
  .sep{width:1px; height:18px; background:var(--line-2); margin:0 6px}
  .spacer{flex:1}

  .btn{height:30px; padding:0 11px; border:0; background:transparent; color:var(--ink-2); border-radius:var(--r-sm); cursor:pointer; font-size:12.5px; font-weight:500; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; user-select:none;
    transition:transform .14s var(--ease-out), background-color .14s ease, color .14s ease;}
  .btn svg{width:15px; height:15px; flex:0 0 auto}
  .btn:disabled{opacity:.35; cursor:not-allowed}
  .btn:not(:disabled):active{transform:scale(.97)}
  @media (hover:hover) and (pointer:fine){ .btn:not(:disabled):hover{background:var(--surface-3); color:var(--ink)} }
  .btn.on{background:var(--surface-3); color:var(--ink)}
  .btn.primary{background:var(--ink); color:#0a0a0b; font-weight:600}
  @media (hover:hover) and (pointer:fine){ .btn.primary:not(:disabled):hover{background:#fff; color:#0a0a0b} }
  .btn.icon{width:30px; padding:0; justify-content:center}
  .btn.rec-on{color:#ff6b5b}

  .select{height:30px; appearance:none; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-sm); padding:0 26px 0 10px; font-size:12.5px; font-weight:500; cursor:pointer; color:var(--ink);
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
    background-position:calc(100% - 13px) 13px, calc(100% - 9px) 13px; background-size:4px 4px,4px 4px; background-repeat:no-repeat;}
  .select option, .select optgroup{background:#18181b; color:var(--ink)}

  /* ---------- main split ---------- */
  main{flex:1 1 auto; display:flex; min-height:0}

  .stage{flex:1 1 auto; position:relative; min-width:0; background:var(--stage);
    background-image:radial-gradient(circle, rgba(255,255,255,.045) 1px, transparent 1.2px); background-size:20px 20px; background-position:center;}
  .viewport{position:absolute; inset:0; display:flex; overflow:hidden; padding:40px 40px 64px}
  .viewport canvas{margin:auto; max-width:100%; max-height:100%; display:none; border-radius:4px;
    box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 30px 80px -24px rgba(0,0,0,.9); background:#000;}
  .stage.actual .viewport{overflow:auto; padding:24px}
  .stage.actual .viewport canvas{max-width:none; max-height:none; border-radius:0}
  .viewport::-webkit-scrollbar{width:10px; height:10px}
  .viewport::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:6px; border:2px solid var(--stage)}
  .viewport::-webkit-scrollbar-corner{background:transparent}

  .drop{position:absolute; inset:24px; border:1px dashed var(--line-2); border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--ink-2); text-align:center; padding:24px; transition:border-color .15s ease, background-color .15s ease; pointer-events:none;}
  .drop .glyphs{font:500 13px/1.25 var(--mono); color:var(--ink-3); letter-spacing:.3em; white-space:pre; margin-bottom:6px}
  .drop.hot{border-color:rgba(255,255,255,.35); background:rgba(255,255,255,.02)}
  .stage.has-image .drop{display:none}
  .stage.has-image .drop.hot{display:flex}
  .drop strong{color:var(--ink); font-weight:500; font-size:14px; letter-spacing:-.01em}
  .drop em{font-style:normal; color:var(--ink-3); font-size:12px}
  .drop kbd{font:500 11px var(--mono); color:var(--ink-2); background:var(--surface-2); border:1px solid var(--line-2); border-radius:4px; padding:1px 5px}

  .hud{position:absolute; left:14px; right:14px; bottom:14px; display:flex; align-items:center; gap:8px; pointer-events:none}
  .pill{display:flex; align-items:center; gap:14px; height:28px; padding:0 12px; font-family:var(--mono); font-size:11px; color:var(--ink-3);
    background:rgba(17,17,19,.72); backdrop-filter:blur(16px) saturate(160%); -webkit-backdrop-filter:blur(16px) saturate(160%);
    border:1px solid var(--line); border-radius:999px; font-variant-numeric:tabular-nums}
  .pill b{color:var(--ink-2); font-weight:500}
  .hud .seg{pointer-events:auto; background:rgba(17,17,19,.72); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--line); border-radius:999px; padding:2px}
  .hud .seg button{height:22px; border-radius:999px; padding:0 10px; font-size:11px}
  .hud .compare{pointer-events:auto; height:28px; border-radius:999px; background:rgba(17,17,19,.72); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--line); font-size:11.5px}
  .hud .compare.on{background:var(--ink); color:#0a0a0b}
  .stage:not(.has-image) .hud{display:none}

  /* ---------- panel ---------- */
  .panel{flex:0 0 312px; width:312px; background:var(--surface); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0;}
  .presetbar{flex:0 0 auto; padding:10px; border-bottom:1px solid var(--line); display:flex; gap:4px; align-items:center}
  .presetbar .select{flex:1; min-width:0}

  .controls{flex:1 1 auto; overflow-y:auto; padding:4px 0 40px; overscroll-behavior:contain}
  .controls::-webkit-scrollbar{width:10px}
  .controls::-webkit-scrollbar-thumb{background:var(--surface-3); border:3px solid var(--surface); border-radius:8px}

  .sec{border-bottom:1px solid var(--line)}
  .shead{width:100%; display:flex; align-items:center; gap:8px; height:40px; padding:0 14px; background:none; border:0; cursor:pointer; font-size:12px; font-weight:600; color:var(--ink); text-align:left; letter-spacing:.005em; user-select:none}
  .shead .chev{margin-left:auto; width:12px; height:12px; color:var(--ink-3); transition:transform .2s var(--ease-out)}
  .sec.closed .shead .chev{transform:rotate(-90deg)}
  .shead .gi{width:14px; height:14px; color:var(--ink-3)}
  .shead .gi svg, .shead .chev svg{width:100%; height:100%; display:block}
  @media (hover:hover) and (pointer:fine){ .shead:hover .chev{color:var(--ink-2)} }
  .sbody{display:grid; grid-template-rows:1fr; transition:grid-template-rows .22s var(--ease-out)}
  .sec.closed .sbody{grid-template-rows:0fr}
  .sinner{overflow:hidden; min-height:0}
  .sinner > div{padding:0 10px 14px; display:flex; flex-direction:column; gap:6px}
  .ctrl[hidden]{display:none}

  /* scrub slider */
  .sl{position:relative; height:28px; border-radius:var(--r-sm); background:var(--surface-2); overflow:hidden; cursor:ew-resize; user-select:none; touch-action:none; transition:background-color .12s ease}
  @media (hover:hover) and (pointer:fine){ .sl:hover{background:var(--surface-3)} .sl:hover .fill::after{opacity:.6} }
  .sl .fill{position:absolute; left:0; top:0; bottom:0; background:var(--fill); pointer-events:none}
  .sl .fill::after{content:""; position:absolute; right:0; top:7px; bottom:7px; width:1.5px; border-radius:1px; background:var(--fill-edge); opacity:0; transition:opacity .12s ease}
  .sl.drag .fill{background:rgba(255,255,255,.13)}
  .sl.drag .fill::after{opacity:1}
  .sl .lab{position:absolute; left:10px; top:0; line-height:28px; color:var(--ink-2); font-size:12px; pointer-events:none}
  .sl .num{position:absolute; right:10px; top:0; line-height:28px; color:var(--ink); font:500 11px/28px var(--mono); font-variant-numeric:tabular-nums; pointer-events:none}
  .sl:focus-visible{outline:2px solid rgba(255,255,255,.4); outline-offset:-2px}

  /* segmented */
  .seg{display:flex; gap:2px; padding:2px; background:var(--surface-2); border-radius:var(--r-sm)}
  .seg button{flex:1; height:24px; background:transparent; border:0; color:var(--ink-3); font-size:11.5px; font-weight:500; cursor:pointer; border-radius:4px; transition:color .14s ease, background-color .14s ease}
  .seg button.on{background:var(--hover); color:var(--ink)}
  .seg{min-width:0} .seg button{min-width:0; padding:0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  @media (hover:hover) and (pointer:fine){ .seg button:not(.on):hover{color:var(--ink-2)} }
  .lrow{display:flex; align-items:center; gap:10px}
  .lrow > span{flex:0 0 74px; color:var(--ink-3); font-size:12px}
  .lrow .seg{flex:1}

  /* toggle */
  .toggle{display:flex; align-items:center; justify-content:space-between; height:28px; padding:0 10px; border-radius:var(--r-sm); background:var(--surface-2); cursor:pointer; color:var(--ink-2); font-size:12px; user-select:none}
  .toggle .knob{width:26px; height:16px; border-radius:999px; background:var(--hover); position:relative; transition:background-color .2s var(--ease-out)}
  .toggle .knob::after{content:""; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:var(--ink-2); transition:transform .2s var(--ease-out), background-color .2s ease}
  .toggle.on .knob{background:var(--ink)}
  .toggle.on .knob::after{transform:translateX(10px); background:#0a0a0b}

  /* colour + text inputs */
  .field{display:flex; align-items:center; gap:8px; height:28px; padding:0 4px 0 10px; border-radius:var(--r-sm); background:var(--surface-2)}
  .field > span{color:var(--ink-2); font-size:12px; flex:0 0 auto}
  .textin{flex:1; min-width:0; height:22px; background:transparent; border:0; text-align:right; padding:0 6px; font:500 12px var(--mono); letter-spacing:.12em; color:var(--ink)}
  .textin:focus{outline:none}
  .field:focus-within{box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
  .swatch{margin-left:auto; position:relative; width:42px; height:20px; border-radius:4px; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .swatch input{position:absolute; inset:-4px; width:calc(100% + 8px); height:calc(100% + 8px); border:0; padding:0; cursor:pointer; background:none}
  .hex{font:500 11px var(--mono); color:var(--ink-2); text-transform:uppercase}

  .hint{padding:12px 14px 0; color:var(--ink-3); font-size:11px; line-height:1.55}
  .hint kbd{font:500 10.5px var(--mono); color:var(--ink-2); background:var(--surface-2); border:1px solid var(--line); border-radius:3px; padding:0 4px}

  /* toast */
  .toast{position:fixed; left:50%; top:62px; transform:translate(-50%,-6px); background:rgba(32,32,36,.9); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--line-2); color:var(--ink); padding:8px 14px; border-radius:999px; font-size:12px; font-weight:500; opacity:0; pointer-events:none; box-shadow:0 10px 30px -10px rgba(0,0,0,.7); transition:opacity .2s var(--ease-out), transform .2s var(--ease-out); z-index:30;}
  .toast.show{opacity:1; transform:translate(-50%,0)}
  input[type=file]{display:none}

  @media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms !important} }
  @media (max-width:860px){
    main{flex-direction:column}
    .panel{flex:0 0 auto; width:100%; max-height:46vh; border-left:0; border-top:1px solid var(--line)}
    .btn .lbl{display:none}
    .viewport{padding:16px 16px 56px}
  }
  /* tabs */
  .tabs{display:flex; gap:2px; padding:2px; background:var(--surface-2); border-radius:7px; margin-right:6px}
  .tabs button{height:26px; padding:0 12px; border:0; background:transparent; color:var(--ink-3); font-size:12.5px; font-weight:500; border-radius:5px; cursor:pointer; transition:color .14s ease, background-color .14s ease}
  .tabs button.on{background:var(--hover); color:var(--ink)}
  @media (hover:hover) and (pointer:fine){ .tabs button:not(.on):hover{color:var(--ink-2)} }
  .viewport canvas.alpha{background-color:#1a1a1d; background-image:conic-gradient(#232327 25%, transparent 0 50%, #232327 0 75%, transparent 0); background-size:16px 16px}
  .controls[hidden]{display:none}
  /* timeline scrubber */
  .timeline{pointer-events:auto; position:relative; width:230px; height:28px; border-radius:999px; overflow:hidden; cursor:ew-resize; touch-action:none; user-select:none;
    background:rgba(17,17,19,.72); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--line)}
  .timeline .tf{position:absolute; left:0; bottom:0; height:2px; background:rgba(255,255,255,.75)}
  @media (hover:hover) and (pointer:fine){ .timeline:hover{background:rgba(32,32,36,.8)} }
  .timeline span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:6px; font:500 11px var(--mono); color:var(--ink-2); font-variant-numeric:tabular-nums; pointer-events:none}
  .timeline span b{color:var(--ink); font-weight:500}
  /* video popover — scales from its trigger */
  .pop{position:fixed; top:54px; right:10px; width:308px; z-index:25; display:flex; flex-direction:column; gap:7px; padding:12px;
    background:rgba(24,24,27,.94); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%);
    border:1px solid var(--line-2); border-radius:12px; box-shadow:0 24px 60px -16px rgba(0,0,0,.85);
    transform-origin:top right; opacity:0; transform:scale(.97) translateY(-4px); visibility:hidden; pointer-events:none;
    transition:opacity .16s var(--ease-out), transform .16s var(--ease-out), visibility 0s linear .16s}
  .pop.open{opacity:1; transform:none; visibility:visible; pointer-events:auto; transition-delay:0s}
  .pop-title{display:flex; align-items:baseline; justify-content:space-between; font-size:12.5px; font-weight:600; padding:2px 2px 4px}
  .pop-title span{font:500 11px var(--mono); color:var(--ink-3); font-variant-numeric:tabular-nums}
  .pop .lrow > span{flex-basis:70px}
  .pop-note{color:var(--ink-3); font-size:11px; line-height:1.5; padding:2px 2px 0}
  .prog{height:4px; border-radius:2px; background:var(--surface-3); overflow:hidden; display:none}
  .prog.on{display:block}
  .prog div{height:100%; width:0; background:var(--ink); transition:width .1s linear}
  .btn.wide{width:100%; justify-content:center; height:32px; margin-top:2px}
  .mselect{width:100%}
  @media (max-width:860px){ .timeline{width:150px} .hud .compare{display:none} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="logo">a</span><h1>ASCII <span>Studio</span></h1></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <span class="sep"></span>
    <button class="btn" id="loadBtn" title="Open image (O)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Open</span></button>
    <button class="btn" id="playBtn" title="Play / pause motion (Space)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg><span class="lbl">Play</span></button>
    <div class="spacer"></div>
    <button class="btn" id="copyBtn" disabled title="Copy image to clipboard (⌘C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></svg><span class="lbl">Copy</span></button>
    <button class="btn" id="videoBtn" disabled title="Export video (V)" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6" width="12.5" height="12" rx="2"/><path d="m16 10.5 4.5-2.5v8L16 13.5"/></svg><span class="lbl">Video</span></button>
    <span class="sep"></span>
    <select id="fmt" class="select" title="Export format">
      <option value="png">PNG</option>
      <option value="jpeg">JPEG</option>
      <option value="webp">WebP</option>
    </select>
    <button class="btn primary" id="exportBtn" disabled title="Export at source resolution (E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="lbl">Export</span></button>
  </header>

  <main>
    <div class="stage" id="stage">
      <div class="viewport" id="viewport"></div>
      <div class="drop" id="drop">
        <div class="glyphs" id="dropGlyphs"></div>
        <strong>Drop an image to begin</strong>
        <em id="dropHint"></em>
      </div>
      <div class="hud">
        <div class="pill" id="pill"><span>src <b id="dimSrc">—</b></span><span><span id="statLabel">grid</span> <b id="dimGrid">—</b></span><span><b id="ms">—</b> ms</span></div>
        <div class="timeline" id="timeline" title="Drag to scrub the loop"><div class="tf" id="tlFill"></div><span><b id="tlNow">0.0</b>/ <i id="tlLen" style="font-style:normal">6.0</i>s</span></div>
        <div class="spacer"></div>
        <button class="btn compare" id="compareBtn" title="Hold to see the original (C)">Hold to compare</button>
        <div class="seg" id="zoomSeg"><button class="on" data-z="fit">Fit</button><button data-z="1">1:1</button></div>
      </div>
    </div>

    <aside class="panel">
      <div class="presetbar">
        <select id="presetSel" class="select"></select>
        <button class="btn icon" id="savePresetBtn" title="Save preset as JSON"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
        <button class="btn icon" id="loadPresetBtn" title="Load preset JSON"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></svg></button>
        <button class="btn icon" id="resetBtn" title="Reset all to defaults"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
      </div>
      <div id="panels" style="display:contents"></div>
    </aside>
  </main>
</div>

<input type="file" id="fileInput" accept="image/*" />
<input type="file" id="presetInput" accept=".json,application/json" />
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="pop" id="videoPop" role="dialog" aria-label="Export video">
  <div class="pop-title">Export video <span id="vidInfo"></span></div>
  <div class="lrow"><span>Length</span><div class="seg" data-v="loops"><button data-val="1">1 loop</button><button data-val="2">2</button><button data-val="3">3</button><button data-val="4">4</button></div></div>
  <div class="lrow"><span>Frame rate</span><div class="seg" data-v="fps"><button data-val="24">24</button><button data-val="30">30</button><button data-val="60">60</button></div></div>
  <div class="lrow"><span>Size</span><div class="seg" data-v="size"><button data-val="0">Full</button><button data-val="1">1080p</button><button data-val="2">720p</button></div></div>
  <div class="lrow"><span>Quality</span><div class="seg" data-v="quality"><button data-val="0">Good</button><button data-val="1">High</button><button data-val="2">Max</button></div></div>
  <div class="lrow"><span>Format</span><div class="seg" data-v="format"><button data-val="0">MP4</button><button data-val="1">WebM</button></div></div>
  <div class="pop-note" id="vidNote"></div>
  <div class="prog" id="vidProg"><div></div></div>
  <button class="btn primary wide" id="vidGo">Export video</button>
</div>

  _ensureSamples(cols,rows){

    sc.imageSmoothingEnabled=true; sc.imageSmoothingQuality="high";

}

  { g:"Dissolve", k:"softness",   label:"Softness",     min:0, max:1,   step:0.01, def:0.4 },
  { g:"Dissolve", k:"rough",      label:"Ragged edge",  min:0, max:1,   step:0.01, def:0.16 },

          let cr,cg,cb;
          if(mono){ cr=ink[0]; cg=ink[1]; cb=ink[2]; if(lf<1){ cr*=lf; cg*=lf; cb*=lf; } }
          else { cr=lo[j]/255*lf; cg=lo[j+1]/255*lf; cb=lo[j+2]/255*lf; }
          let idx;
          if(p.order===2) idx=(gx+gy*3)%len;
          else if(p.order===1){ const l=0.299*lo[j]+0.587*lo[j+1]+0.114*lo[j+2]; idx=Math.min(len-1,Math.floor(l/256*len)); }
          else idx=Math.floor(rand2(cx*5.3+c*1.1, cy*9.1+c*3.7)*len);
          if(shf>0 && rand2(cx*2.7+c, cy*1.9+shTick)<shf) idx=Math.floor(rand2(cx+shTick*0.37, cy+c)*len);
          ctx.globalAlpha=alpha;
          ctx.fillStyle=`rgb(${clamp01(cr)*255|0},${clamp01(cg)*255|0},${clamp01(cb)*255|0})`;
          ctx.fillText(chars[idx]||chars[0],X,Y);
          count++;
        }
      }
    }
    ctx.globalAlpha=1;
    this.count=count;
  }
}

function onChange(t,key){

function makeSlider(t, p, ctrl){
  const el=document.createElement("div"); el.className="sl"; el.tabIndex=0;
  el.setAttribute("role","slider"); el.setAttribute("aria-label",p.label);
  el.setAttribute("aria-valuemin",p.min); el.setAttribute("aria-valuemax",p.max);
  el.innerHTML=`<div class="fill"></div><span class="lab">${p.label}</span><span class="num"></span>`;
  el.title="Drag to scrub · Shift for fine · Double-click to reset";
  const fill=el.firstChild, num=el.querySelector(".num");
  const snap=v=>{ v=Math.round((v-p.min)/p.step)*p.step+p.min; return Math.min(p.max,Math.max(p.min,+v.toFixed(4))); };
  const show=v=>{ fill.style.width=((v-p.min)/(p.max-p.min)*100)+"%"; num.textContent=Number(v).toFixed(decimals(p.step))+(p.unit||""); el.setAttribute("aria-valuenow",v); };
  const commit=v=>{ v=snap(v); if(v===t.state[p.k]) return; t.state[p.k]=v; show(v); onChange(t,p.k); };

  let sx=0, sv=0, moved=false, id=null, rect=null;
  el.addEventListener("pointerdown",e=>{
    if(e.button!==0) return;
    el.setPointerCapture(e.pointerId); id=e.pointerId; rect=el.getBoundingClientRect();
    sx=e.clientX; sv=t.state[p.k]; moved=false; el.classList.add("drag");
  });
  el.addEventListener("pointermove",e=>{
    if(e.pointerId!==id) return;
    const dx=e.clientX-sx;
    if(!moved && Math.abs(dx)<3) return;
    moved=true;
    commit(sv + dx/rect.width*(p.max-p.min)*(e.shiftKey?0.1:1));
  });
  const end=e=>{
    if(e.pointerId!==id) return; id=null; el.classList.remove("drag");
    if(!moved && e.type==="pointerup"){ commit(p.min + (e.clientX-rect.left)/rect.width*(p.max-p.min)); }
  };
  el.addEventListener("pointerup",end); el.addEventListener("pointercancel",end);
  el.addEventListener("dblclick",()=>commit(p.def));
  el.addEventListener("keydown",e=>{
    const m=e.shiftKey?10:1;
    if(e.key==="ArrowRight"||e.key==="ArrowUp"){ commit(t.state[p.k]+p.step*m); e.preventDefault(); }
    else if(e.key==="ArrowLeft"||e.key==="ArrowDown"){ commit(t.state[p.k]-p.step*m); e.preventDefault(); }
    else if(e.key==="Backspace"||e.key==="Delete"){ commit(p.def); e.preventDefault(); }
  });
  ctrl.appendChild(el);
  return { set:v=>show(v) };
}

function buildControls(t){
  const root=t.el; root.innerHTML=""; t.inputs={}; t.visRules=[]; t.labelRules=[];
  const groups=[];

    grp.items.forEach(p=>{

      if(p.type==="seg"){

        const seg=document.createElement("div"); seg.className="seg"; seg.setAttribute("role","radiogroup");
        p.options.forEach(([lab,val])=>{
          const b=document.createElement("button"); b.textContent=lab; b.setAttribute("role","radio");
          b.onclick=()=>{ t.state[p.k]=val; t.inputs[p.k].set(val); onChange(t,p.k); };
          seg.appendChild(b);
        });
        row.appendChild(seg); ctrl.appendChild(row);
        t.inputs[p.k]={ set:v=>[...seg.children].forEach((c,i)=>{ const on=p.options[i][1]===v; c.classList.toggle("on",on); c.setAttribute("aria-checked",on); }) };
        if(p.optLabels) (t.labelRules=t.labelRules||[]).push([[...seg.children],p.optLabels]);

      } else if(p.type==="mpreset"){
        const sel=document.createElement("select"); sel.className="select mselect"; sel.setAttribute("aria-label","Video preset");
        sel.innerHTML=`<option value="" selected>Video presets…</option>`+Object.keys(t.motion).map(n=>`<option value="${n}">${n}</option>`).join("");
        sel.onchange=()=>{ if(sel.value) applyMotionPreset(t, sel.value); sel.value=""; };
        ctrl.appendChild(sel);

      } else if(p.type==="toggle"){
        const tog=document.createElement("div"); tog.className="toggle"; tog.tabIndex=0; tog.setAttribute("role","switch");
        tog.innerHTML=`<span>${p.label}</span><span class="knob"></span>`;
        const flip=()=>{ t.state[p.k]=t.state[p.k]?0:1; t.inputs[p.k].set(t.state[p.k]); onChange(t,p.k); };
        tog.onclick=flip; tog.onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); e.stopPropagation(); flip(); } };
        ctrl.appendChild(tog);
        t.inputs[p.k]={ set:v=>{ tog.classList.toggle("on",!!v); tog.setAttribute("aria-checked",!!v); } };

      } else if(p.type==="color"){
        const row=document.createElement("label"); row.className="field";
        row.innerHTML=`<span>${p.label}</span><span class="hex"></span>`;
        const sw=document.createElement("span"); sw.className="swatch";
        const inp=document.createElement("input"); inp.type="color";
        inp.oninput=e=>{ t.state[p.k]=e.target.value; hex.textContent=e.target.value; onChange(t,p.k); };
        sw.appendChild(inp); row.appendChild(sw); ctrl.appendChild(row);
        const hex=row.querySelector(".hex");
        t.inputs[p.k]={ set:v=>{ inp.value=v; hex.textContent=v; } };

      } else if(p.type==="text"){
        const row=document.createElement("label"); row.className="field";
        row.innerHTML=`<span>${p.label}</span>`;
        const inp=document.createElement("input"); inp.type="text"; inp.className="textin"; inp.spellcheck=false; inp.autocomplete="off";
        inp.oninput=e=>{ t.state[p.k]=e.target.value; onChange(t,p.k); };
        row.appendChild(inp); ctrl.appendChild(row);
        t.inputs[p.k]={ set:v=>inp.value=v };

      } else {
        t.inputs[p.k]=makeSlider(t, p, ctrl);
      }
      list.appendChild(ctrl);
    });
    inner.appendChild(list); body.appendChild(inner);
    sec.appendChild(head); sec.appendChild(body); root.appendChild(sec);
  });
  const hint=document.createElement("div"); hint.className="hint";
  hint.innerHTML=`Drag any value to scrub, hold <kbd>Shift</kbd> for fine control, double-click to reset. <kbd>1</kbd> <kbd>2</kbd> tabs · <kbd>Space</kbd> play · <kbd>C</kbd> compare · <kbd>⌘C</kbd> copy · <kbd>E</kbd> export · <kbd>V</kbd> video.`;
  root.appendChild(hint);
}
function applyMotionPreset(t,name){
  const m=t.motion[name]; if(!m) return;
  t.params.forEach(p=>{ if(MOTION_GROUPS.has(p.g) && p.def!==undefined) t.state[p.k]=p.def; });
  Object.assign(t.state, m);
  syncUI(t); onChange(t,"motion");
  t.animTime=0;
  if(t.img && name!=="Still" && !playing) setPlaying(true);
  if(name==="Still" && playing) setPlaying(false);
  toast(`“${name}” · ${t.state.loopLen}s loop`);
}
function syncUI(t){ t.params.forEach(p=> t.inputs[p.k] && t.inputs[p.k].set(t.state[p.k])); refreshVisibility(t); }
function applySettings(t,obj){
  t.params.forEach(p=>{ if(obj[p.k]===undefined) return; const v=obj[p.k];
    if(typeof v==="number" && Number.isNaN(v)) return; t.state[p.k]=v; });
  syncUI(t); onChange(t,"font");
}
function fontsReady(t){
  if(!document.fonts || !document.fonts.load) return Promise.resolve();
  const fam=["Geist Mono","JetBrains Mono",null,"PP Hatton"][t.state.font];
  if(!fam) return Promise.resolve();
  return document.fonts.load(`${t.state.italic?"italic ":""}${fontWeight(t.state)} 16px "${fam}"`).then(()=>{
    Object.values(tools).forEach(x=>{ if(x.r.rampCache) x.r.rampCache={}; });
    Object.keys(densityCache).forEach(k=>delete densityCache[k]);
  }).catch(()=>{});
}

function switchTool(id){

/* ---- render loop (only the active tab renders) ---- */
function loop(ts){
  const dt = lastTS ? Math.min((ts-lastTS)/1000, 0.05) : 0; lastTS=ts;
  const t=tool;
  if(exporting){ requestAnimationFrame(loop); return; }
  const L=Math.max(0.5,t.state.loopLen||6);
  if(playing){ t.animTime=(t.animTime+dt)%L; t.dirty=true; }
  updateTimeline(t,L);
  if(t.dirty && t.img && !t.crashed){
    t.dirty=false;
    try{
      const t0=performance.now();
      t.r.render(t.state, t.animTime, {compare:comparing, playing});
      if(!comparing){
        $("#ms").textContent=(performance.now()-t0).toFixed(0);
        $("#dimGrid").textContent = t.id==="glow" ? `${t.r.cols}×${t.r.rows}` : (t.r.count||0).toLocaleString();
      }
    }
    catch(e){ t.crashed=true; setPlaying(false); console.error(e); toast("Couldn’t render: "+(e && e.message || e)); }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---- timeline scrubber ---- */
const tlEl=$("#timeline"), tlFill=$("#tlFill"), tlNow=$("#tlNow"), tlLen=$("#tlLen");
let tlLast="";
function updateTimeline(t,L){
  const f=fract((t.animTime||0)/L), key=f.toFixed(4)+"|"+L;
  if(key===tlLast) return; tlLast=key;
  tlFill.style.width=(f*100)+"%"; tlNow.textContent=(f*L).toFixed(1); tlLen.textContent=L.toFixed(1);
}
let tlId=null;
const scrubTo=e=>{ const r=tlEl.getBoundingClientRect(), L=Math.max(0.5,tool.state.loopLen||6);
  tool.animTime=clamp01((e.clientX-r.left)/r.width)*L*0.9999; tool.dirty=true; };
tlEl.addEventListener("pointerdown",e=>{ tlEl.setPointerCapture(e.pointerId); tlId=e.pointerId; if(playing) setPlaying(false); scrubTo(e); });
tlEl.addEventListener("pointermove",e=>{ if(e.pointerId===tlId) scrubTo(e); });
["pointerup","pointercancel"].forEach(ev=>tlEl.addEventListener(ev,e=>{ if(e.pointerId===tlId) tlId=null; }));

/* ---- image loading (into the active tab) ---- */
function loadFile(file){
  if(!file || !file.type.startsWith("image/")){ toast("That’s not an image file"); return; }
  const t=tool;
  const url=URL.createObjectURL(file); const img=new Image();
  img.onload=()=>{
    t.img=img; t.name=file.name.replace(/\.[^.]+$/,"") || "image"; t.crashed=false;
    t.r.setImage(img);
    if(t===tool){
      t.canvas.style.display="block";
      stage.classList.add("has-image");
      $("#exportBtn").disabled=$("#copyBtn").disabled=$("#videoBtn").disabled=false;
      $("#dimSrc").textContent=`${t.r.srcW}×${t.r.srcH}`;
    }
    if(t.r.capped) toast(`Large image downscaled to ${t.r.w}×${t.r.h} for performance`);
    t.dirty=true;
  };
  img.onerror=()=>{ toast("Couldn’t decode that image"); URL.revokeObjectURL(url); };
  img.src=url;
}
$("#fileInput").onchange=e=>{ loadFile(e.target.files[0]); e.target.value=""; };
$("#loadBtn").onclick=()=>$("#fileInput").click();

const drop=$("#drop");
let dragDepth=0;
stage.addEventListener("dragenter",e=>{ e.preventDefault(); dragDepth++; drop.classList.add("hot"); });
stage.addEventListener("dragover",e=>e.preventDefault());
stage.addEventListener("dragleave",e=>{ e.preventDefault(); if(--dragDepth<=0){ dragDepth=0; drop.classList.remove("hot"); } });

/* ---- playback ---- */
const playBtn=$("#playBtn");

const PAUSE=`<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5.5" width="4" height="13" rx="1"/><rect x="13.5" y="5.5" width="4" height="13" rx="1"/></svg><span class="lbl">Pause</span>`;

/* ---- video export ----
   MP4 is rendered offline, frame by frame (WebCodecs + mp4-muxer): every frame is exact
   and the clip loops seamlessly regardless of how heavy the settings are.
   WebM falls back to real-time capture. */
var exporting=false, videoOpen=false, cancelExport=false;
const video={ loops:1, fps:30, size:0, quality:1, format: (window.VideoEncoder && window.Mp4Muxer) ? 0 : 1 };
const videoBtn=$("#videoBtn"), videoPop=$("#videoPop"), vidGo=$("#vidGo"), vidProg=$("#vidProg"), vidNote=$("#vidNote"), vidInfo=$("#vidInfo");
const canMP4=!!(window.VideoEncoder && window.VideoFrame && window.Mp4Muxer);
const canWebM=!!(window.MediaRecorder && HTMLCanvasElement.prototype.captureStream);

function videoDims(t){
  let W=t.r.w, H=t.r.h;
  const cap=video.size===1?1080:video.size===2?720:Infinity;
  const sc=Math.min(1, cap/Math.min(W,H));
  return [Math.max(2,Math.round(W*sc/2)*2), Math.max(2,Math.round(H*sc/2)*2)];
}
function syncVideoUI(){
  videoPop.querySelectorAll(".seg[data-v]").forEach(seg=>{
    const key=seg.dataset.v;
    [...seg.children].forEach(b=>{
      const on=Number(b.dataset.val)===video[key]; b.classList.toggle("on",on);
      if(key==="format") b.disabled = b.dataset.val==="0" ? !canMP4 : !canWebM;
    });
  });
  const t=tool; if(!t || !t.img) return;
  const L=Math.max(0.5,t.state.loopLen||6), [W,H]=videoDims(t);
  vidInfo.textContent=`${(L*video.loops).toFixed(1)}s · ${W}×${H}`;
  const still = !t.params.some(p=>MOTION_GROUPS.has(p.g) && p.def!==undefined && p.k!=="loopLen" && t.state[p.k]!==p.def);
  vidNote.textContent = still ? "Nothing is animated yet — pick a video preset in Motion first."
    : video.format===0 ? "Rendered frame by frame, so every frame is exact and the loop is seamless."
    : "WebM records in real time; heavy settings may drop frames. MP4 is smoother.";
  if(t.id==="defrag" && t.state.bg===3) vidNote.textContent+=" Video has no transparency — the clear background becomes black.";
}
videoPop.querySelectorAll(".seg[data-v]").forEach(seg=>seg.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b || b.disabled || exporting) return;
  video[seg.dataset.v]=Number(b.dataset.val); syncVideoUI();
}));
function openVideo(){
  if(!tool.img){ toast("Open an image first"); return; }
  const r=videoBtn.getBoundingClientRect();
  videoPop.style.right=Math.max(10, innerWidth-r.right)+"px";
  videoPop.style.top=(r.bottom+6)+"px";
  syncVideoUI(); videoPop.classList.add("open"); videoOpen=true; videoBtn.classList.add("on");
}
function closeVideo(){ if(exporting) return; videoPop.classList.remove("open"); videoOpen=false; videoBtn.classList.remove("on"); }
videoBtn.onclick=()=> videoOpen?closeVideo():openVideo();
document.addEventListener("pointerdown",e=>{ if(videoOpen && !videoPop.contains(e.target) && !videoBtn.contains(e.target)) closeVideo(); });

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function setProgress(f,label){ vidProg.classList.add("on"); vidProg.firstChild.style.width=(f*100).toFixed(1)+"%"; if(label) vidGo.textContent=label; }

vidGo.onclick=async()=>{
  if(exporting){ cancelExport=true; return; }
  const t=tool; if(!t.img) return;
  const fps=video.fps, L=Math.max(0.5,t.state.loopLen||6), frames=Math.max(1,Math.round(L*video.loops*fps));
  const [W,H]=videoDims(t);
  const out=document.createElement("canvas"); out.width=W; out.height=H;
  const octx=out.getContext("2d"); octx.imageSmoothingQuality="high";
  const bpp=[0.08,0.16,0.3][video.quality];
  const bitrate=Math.round(Math.min(120e6, Math.max(2e6, W*H*fps*bpp)));
  const flat = t.id==="defrag" ? (t.state.bg===1?"#ffffff":t.state.bg===2?t.state.bgColor:"#000000") : "#000000";
  const drawFrame=i=>{
    t.r.render(t.state, i/fps, {playing:true});
    octx.fillStyle=flat; octx.fillRect(0,0,W,H);
    octx.drawImage(t.canvas,0,0,W,H);
  };
  const wasPlaying=playing; setPlaying(false);
  exporting=true; cancelExport=false; videoBtn.classList.add("rec-on");
  videoPop.classList.add("busy"); setProgress(0,"Cancel");
  const name=`${t.name}_${t.id}_${Math.round(L*video.loops)}s`;
  try{
    if(video.format===0 && canMP4){
      // H.264 first (plays everywhere); VP9-in-MP4 as a fallback for browsers without an H.264 encoder
      const codecs=[["avc1.640034","avc"],["avc1.640033","avc"],["avc1.640028","avc"],["avc1.4d0034","avc"],["avc1.4d0028","avc"],["avc1.42003e","avc"],["vp09.00.51.08","vp9"],["vp09.00.41.08","vp9"]];
      let cfg=null, mcodec=null;
      for(const [codec,mc] of codecs){
        const c={codec, width:W, height:H, bitrate, framerate:fps};
        if(mc==="avc") c.avc={format:"avc"};
        try{ const r=await VideoEncoder.isConfigSupported(c); if(r.supported){ cfg=c; mcodec=mc; break; } }catch(_){}
      }
      if(!cfg) throw new Error(video.size===2 ? "This browser can’t encode MP4 — try WebM" : "This browser can’t encode MP4 at "+W+"×"+H+" — try 1080p or 720p");
      const muxer=new Mp4Muxer.Muxer({ target:new Mp4Muxer.ArrayBufferTarget(), video:{codec:mcodec, width:W, height:H, frameRate:fps}, fastStart:"in-memory" });
      let encErr=null;
      const enc=new VideoEncoder({ output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta), error:e=>{ encErr=e; } });
      enc.configure(cfg);
      const dur=Math.round(1e6/fps);
      for(let i=0;i<frames;i++){
        if(cancelExport || encErr) break;
        drawFrame(i);
        const vf=new VideoFrame(out,{timestamp:i*dur, duration:dur});
        enc.encode(vf,{keyFrame:i%(fps*2)===0}); vf.close();
        while(enc.encodeQueueSize>4) await sleep(2);
        setProgress((i+1)/frames, `Cancel · ${i+1}/${frames}`);
        await sleep(0);
      }
      if(encErr) throw encErr;
      if(cancelExport){ enc.close(); toast("Video export cancelled"); }
      else{
        setProgress(1,"Finishing…");
        await enc.flush(); enc.close(); muxer.finalize();
        download(new Blob([muxer.target.buffer],{type:"video/mp4"}), name+".mp4");
        toast(`Exported ${W}×${H} MP4 · ${frames} frames`);
      }
    } else if(canWebM){
      const mime=["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"].find(m=>MediaRecorder.isTypeSupported(m))||"video/webm";
      const stream=out.captureStream(0), track=stream.getVideoTracks()[0];
      const rec=new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond:bitrate});
      const chunks=[]; rec.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
      const done=new Promise(r=>rec.onstop=r);
      drawFrame(0); rec.start();
      const t0=performance.now();
      for(let i=0;i<frames;i++){
        if(cancelExport) break;
        drawFrame(i); track.requestFrame && track.requestFrame();
        setProgress((i+1)/frames, `Cancel · ${i+1}/${frames}`);
        const wait=t0+(i+1)*1000/fps-performance.now(); await sleep(Math.max(0,wait));
      }
      rec.stop(); await done;
      if(cancelExport) toast("Video export cancelled");
      else { download(new Blob(chunks,{type:mime}), name+".webm"); toast(`Exported ${W}×${H} WebM`); }
    } else throw new Error("Video export isn’t supported in this browser");
  }catch(e){ console.error(e); toast(e && e.message ? e.message : "Video export failed"); }
  exporting=false; cancelExport=false; videoBtn.classList.remove("rec-on");
  vidProg.classList.remove("on"); vidGo.textContent="Export video"; videoPop.classList.remove("busy");
  t.dirty=true; if(wasPlaying) setPlaying(true);
};

/* ---- export ---- */
function download(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function doExport(){
  const t=tool; if(!t.img) return;
  t.r.render(t.state, t.animTime, {playing:false});
  const fmt=$("#fmt").value;
  const mime = fmt==="jpeg"?"image/jpeg":fmt==="webp"?"image/webp":"image/png";
  let out=t.canvas;
  if(fmt==="jpeg" && t.id==="defrag" && t.state.bg===3){   // JPEG has no alpha: flatten on black
    const [c,x]=mk(); c.width=out.width; c.height=out.height; x.fillStyle="#000"; x.fillRect(0,0,c.width,c.height); x.drawImage(out,0,0); out=c;
  }
  out.toBlob(blob=>{
    if(!blob){ toast("Export failed for this format"); return; }
    download(blob, `${t.name}_${t.id}.${fmt==="jpeg"?"jpg":fmt}`);
    toast(`Exported ${out.width}×${out.height} ${fmt.toUpperCase()}`);
  }, mime, fmt==="png"?undefined:0.95);
  t.dirty=true;
}
$("#exportBtn").onclick=doExport;
async function copyImage(){
  const t=tool; if(!t.img) return;
  t.r.render(t.state, t.animTime, {});
  const blob=new Promise((res,rej)=>t.canvas.toBlob(b=>b?res(b):rej(new Error("encode")),"image/png"));
  try{
    await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);
    toast(`Copied ${t.canvas.width}×${t.canvas.height} PNG`);
  }catch(e){ console.warn(e); toast("Couldn’t copy — the browser blocked clipboard access"); }
  t.dirty=true;
}
$("#copyBtn").onclick=copyImage;

/* ---- presets ---- */
presetSel.onchange=e=>{ const s=tool.presets[e.target.value]; if(s) applySettings(tool,s); };
$("#savePresetBtn").onclick=()=>{
  const t=tool;
  const name=prompt("Preset name", t.name?`${t.name} ${t.id}`:`My ${t.label} preset`);
  if(name===null) return;
  const data={ format:"ascii-studio-preset", version:3, tool:t.id, name:name||"preset", settings:{...t.state} };
  download(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}), (name||"preset").replace(/\s+/g,"-").toLowerCase()+".ascii.json");
  toast("Preset saved");
};
$("#loadPresetBtn").onclick=()=>$("#presetInput").click();
$("#presetInput").onchange=e=>{
  const file=e.target.files[0]; if(!file) return; const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(data.tool && tools[data.tool]) switchTool(data.tool);
      applySettings(tool,{...tool.defaults, ...(data.settings||data)}); presetSel.value="";
      toast("Loaded “"+(data.name||file.name)+"”");
    }
    catch(err){ toast("That preset file is invalid"); }
    e.target.value="";
  };
  r.readAsText(file);
};
$("#resetBtn").onclick=()=>{ applySettings(tool,tool.defaults); presetSel.value=""; toast("Reset to defaults"); };

/* ---- keyboard (no animation on keyboard actions) ---- */
const typing = () => { const a=document.activeElement; return a && (a.tagName==="INPUT"||a.tagName==="SELECT"||a.tagName==="TEXTAREA"); };
window.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey) && (e.key==="c"||e.key==="C") && !typing() && !String(window.getSelection()||"")){ e.preventDefault(); copyImage(); return; }
  if(e.key==="Escape" && videoOpen){ closeVideo(); return; }
  if(typing() || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.code==="Space" && !(document.activeElement && document.activeElement.classList.contains("toggle"))){ e.preventDefault(); if(tool.img) setPlaying(!playing); }
  else if(e.key==="o"||e.key==="O"){ $("#fileInput").click(); }
  else if(e.key==="e"||e.key==="E"){ doExport(); }
  else if(e.key==="v"||e.key==="V"){ videoOpen?closeVideo():openVideo(); }
  else if(e.key==="1"){ switchTool("glow"); }
  else if(e.key==="2"){ switchTool("defrag"); }
  else if((e.key==="c"||e.key==="C") && !e.repeat){ setCompare(true); }
});
window.addEventListener("keyup",e=>{ if(e.key==="c"||e.key==="C") setCompare(false); });
window.addEventListener("blur",()=>setCompare(false));

/* ---- toast ---- */
let toastTimer;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1900); }
</script>
</body>
</html>
